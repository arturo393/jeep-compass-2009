types {
    audio/ogg opus;
    audio/opus opus;
    image/webp webp;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        autoindex on;
        
        # Support audio/video seeking with byte-ranges
        add_header Accept-Ranges bytes;
    }
}
